# SRS 5 for Naka AI Live (run with --network host; see install.sh)
# LiveTalking publishes WHIP to 127.0.0.1:1985; viewers play WHEP through naka-live-agent;
# WebRTC media goes over 8000 tcp+udp (the only SRS port that must be public).
listen              127.0.0.1:1935;
max_connections     200;
daemon              off;
srs_log_tank        console;

http_api {
    enabled         on;
    listen          127.0.0.1:1985;
}
http_server {
    enabled         off;
}

rtc_server {
    enabled         on;
    listen          8000;
    protocol        all;
    tcp {
        enabled     on;
        listen      8000;
    }
    # public IP of this box, filled from the CANDIDATE env var (install.sh sets it)
    candidate       $CANDIDATE;
}

vhost __defaultVhost__ {
    rtc {
        enabled     on;
        # LiveTalking pushes WebRTC; keep an RTMP copy so ffmpeg can relay it to TikTok/Facebook
        rtc_to_rtmp on;
        rtmp_to_rtc off;
    }
}
