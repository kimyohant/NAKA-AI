<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}
    body{font-family:Anuphan,"Leelawadee UI",sans-serif;color:#fff;background:radial-gradient(circle at 78% 43%,#28579b 0,#16376d 28%,#091736 67%)}
    .card{position:relative;width:1200px;height:630px;padding:54px 76px;overflow:hidden}
    .brand{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:700;letter-spacing:-.04em}.brand img{width:53px;height:53px}.brand b{color:#8de1ff}
    .eyebrow{margin:45px 0 15px;color:#a5dfff;font-size:18px;font-weight:700}
    h1{position:relative;z-index:2;margin:0;font-family:"IBM Plex Sans Thai",Anuphan,"Leelawadee UI",sans-serif;font-size:69px;line-height:1.13;letter-spacing:-.052em;font-weight:700}
    h1 em{font-style:normal;color:#8cdeff}.sub{position:relative;z-index:2;margin:22px 0 0;font-size:21px;line-height:1.5;color:#d7e8ff}
    .platforms{position:absolute;left:76px;bottom:45px;z-index:3;display:flex;gap:10px}.platforms span{font-size:15px;font-weight:700;padding:8px 14px;border:1px solid #ffffff4b;border-radius:9px;background:#ffffff10}
    .phone{position:absolute;right:143px;top:96px;width:253px;height:446px;padding:12px;border:5px solid #698bc0;border-radius:38px;background:#08142c;transform:rotate(7deg);box-shadow:0 27px 70px #010c29a6}
    .phone img{display:block;width:100%;height:100%;object-fit:cover;border-radius:23px}.phone:after{content:"▶";position:absolute;left:50%;top:50%;display:grid;place-items:center;width:76px;height:76px;transform:translate(-50%,-50%);border:1px solid #fff7;border-radius:50%;background:#091736b9;font:29px Arial,sans-serif;color:white}
    .mascot{position:absolute;right:6px;bottom:10px;z-index:2;width:268px;height:268px;object-fit:contain;filter:drop-shadow(0 18px 25px #0114329c)}
    .spark{position:absolute;right:465px;top:246px;font-size:37px;color:#96dfff}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="../../public/logo.svg" alt="">naka<b>-ai.</b></div>
    <p class="eyebrow">ทีม AI สำหรับร้านค้าออนไลน์ไทย</p>
    <h1>ใส่รูปสินค้า<br><em>ได้คลิปขาย</em><br>พร้อมโพสต์</h1>
    <p class="sub">คลิปขาย · ละครสั้น · AI Live · ตอบลูกค้า</p>
    <div class="platforms"><span>Shopee</span><span>Facebook</span><span>TikTok</span><span>Instagram</span></div>
    <span class="spark">✦</span>
    <div class="phone"><img src="../../public/assets/soap-campaign.png" alt=""></div>
    <img class="mascot" src="../../public/assets/naka-plush-sales.png" alt="">
  </div>
</body>
</html>
