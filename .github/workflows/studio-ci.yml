# Studio (apps/studio): backend, admin and frontend checks on pushes/PRs that touch it.
name: Studio CI

on:
  push:
    paths: ['apps/studio/**', '.github/workflows/studio-ci.yml']
  pull_request:
    paths: ['apps/studio/**', '.github/workflows/studio-ci.yml']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/studio/backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # naka-sso.test.ts also checks the contract against apps/landing/src/auth/studio.ts (same checkout)
      - run: npx tsx --test tests/sqlite-migration-backup.test.ts tests/server-security-recovery.test.ts tests/hypit-render.test.ts tests/admin-guard.test.ts tests/seller.test.ts tests/naka-sso.test.ts tests/ownership.test.ts

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/studio/admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run generate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/studio/frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/video-preflight.test.mjs tests/ai-seller-structure.test.mjs
      - run: npm run build
