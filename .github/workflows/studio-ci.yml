# Studio (apps/studio): backend, admin and frontend checks on pushes/PRs that touch it.
name: Studio CI

on:
  push:
    # the entitlement test loads the account migrations (docs/entitlements.md)
    paths: ['apps/studio/**', 'apps/landing/migrations/pg/**', '.github/workflows/studio-ci.yml']
  pull_request:
    # the entitlement test loads the account migrations (docs/entitlements.md)
    paths: ['apps/studio/**', 'apps/landing/migrations/pg/**', '.github/workflows/studio-ci.yml']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/studio/backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # docs/adr/0004 step 9: the old SQLite → PostgreSQL import (node:sqlite builds the old file; Node 24)
      - run: npx tsx --test tests/import-sqlite.test.ts
      # tests run on PGlite (in-process PostgreSQL, DATABASE_URL=pglite://…): no database service needed
      # naka-sso.test.ts also checks the contract against apps/landing/src/auth/studio.ts (same checkout)
      - run: npx tsx --test tests/campaigns-migration.test.ts tests/server-security-recovery.test.ts tests/hypit-render.test.ts tests/admin-guard.test.ts tests/seller.test.ts tests/naka-sso.test.ts tests/ownership.test.ts tests/entitlements.test.ts tests/concurrency.test.ts tests/query-budget.test.ts tests/module-boundaries.test.mjs

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/studio/admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run generate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/studio/frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/video-preflight.test.mjs tests/ai-seller-structure.test.mjs
      - run: npm run build
