# Manual production deploy: Actions > Deploy > Run workflow (from main).
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. See docs/DEPLOY.md.
# No DB dump here (it would put customer data in GitHub); D1 Time Travel restores any minute of the last 30 days.
name: Deploy

on:
  workflow_dispatch:

concurrency: production

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler d1 migrations apply naka-ai-db --remote
      - run: npx wrangler deploy
