# Landing (apps/landing): typecheck and every test on pushes/PRs that touch it. The PostgreSQL service
# runs tests/postgres.integration.test.cjs (concurrent requests on a real server + connection pool).
name: Landing CI

on:
  push:
    paths: ['apps/landing/**', '.github/workflows/landing-ci.yml']
  pull_request:
    paths: ['apps/landing/**', '.github/workflows/landing-ci.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: naka
          POSTGRES_USER: naka_admin
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U naka_admin -d naka" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://naka_admin:ci-only-password@127.0.0.1:5432/naka
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
