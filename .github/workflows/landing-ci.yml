# Landing (apps/landing): typecheck and run every test on pushes/PRs that touch it.
name: Landing CI

on:
  push:
    paths: ['apps/landing/**', '.github/workflows/landing-ci.yml']
  pull_request:
    paths: ['apps/landing/**', '.github/workflows/landing-ci.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # tests use node:sqlite
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
