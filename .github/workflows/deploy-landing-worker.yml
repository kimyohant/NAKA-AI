# naka-ai.com Worker deploy from THIS repo — prepared for the switch, NOT the production deploy yet.
# Production still deploys from kimyohant/naka-ai-landing (Actions > Deploy) until the owner switches.
# Needs secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, LANDING_REPO_TOKEN (read access to naka-ai-landing).
# Before the first run: disable the Deploy workflow in naka-ai-landing so only one place deploys.
name: Deploy naka-ai.com Worker

on:
  workflow_dispatch:

concurrency: production

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: naka-ai-backend
      # the Worker serves the static pages from ../../naka-ai-landing/public (wrangler.jsonc assets.directory)
      - uses: actions/checkout@v4
        with:
          repository: kimyohant/naka-ai-landing
          token: ${{ secrets.LANDING_REPO_TOKEN }}
          path: naka-ai-landing
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: naka-ai-backend/landing-worker/package-lock.json
      - run: npm ci
        working-directory: naka-ai-backend/landing-worker
      - run: npm run typecheck && npm test
        working-directory: naka-ai-backend/landing-worker
      - run: npx wrangler d1 migrations apply naka-ai-db --remote
        working-directory: naka-ai-backend/landing-worker
      - run: npx wrangler deploy
        working-directory: naka-ai-backend/landing-worker
