name: CI

# The backend moved to kimyohant/naka-ai-backend (its own CI). Tests here that compare against backend
# sources skip themselves when that repo is not checked out next to this one.
on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node --test tests/*.test.mjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test desktop/tests/*.test.mjs
