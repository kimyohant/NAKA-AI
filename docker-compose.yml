# NAKA-AI platform on one Docker host (docs/adr/0002, docs/adr/0004).
#
#   cp .env.example .env    # then set every password
#   docker compose up -d postgres
#
#   docker compose up -d --build            # postgres + landing (naka-ai.com)
#
# landing (apps/landing) is on PostgreSQL; studio joins this file when it moves too (ADR-0004
# phase 2) — until then apps/studio keeps its own docker-compose.yml.
name: naka

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: naka
      POSTGRES_USER: ${POSTGRES_USER:-naka_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Set ACCOUNT_DB_PASSWORD in .env}
      STUDIO_DB_PASSWORD: ${STUDIO_DB_PASSWORD:?Set STUDIO_DB_PASSWORD in .env}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:?Set REPORTING_DB_PASSWORD in .env}
      TZ: Asia/Bangkok
    volumes:
      - pgdata:/var/lib/postgresql/data
      # runs once, on an empty volume (schemas, roles, passwords)
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    # local tools only (psql, DBeaver); apps reach it as postgres:5432 on the compose network
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d naka"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  landing:
    build: ./apps/landing
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://account_app:${ACCOUNT_DB_PASSWORD}@postgres:5432/naka
      MEDIA_DIR: /data/media
      TZ: Asia/Bangkok
    # the Worker's vars and secrets (APP_ORIGIN, SESSION_SECRET, ADMIN_TOKEN, …) — see apps/landing/.env.example
    env_file:
      - path: ./apps/landing/.env.production
        required: false
    volumes:
      - landing-media:/data/media
    # behind Caddy / Cloudflare Tunnel in production (ADR-0002); local port for testing
    ports:
      - "127.0.0.1:8788:8788"
    restart: unless-stopped

volumes:
  pgdata:
  landing-media:
