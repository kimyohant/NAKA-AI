# 火宝短剧 Docker 一体化部署：应用 + Watchtower（自动拉新镜像重建容器，支撑应用内一键更新）
#
# 使用：
#   1. 复制 .env.example 为 .env 并修改 WATCHTOWER_TOKEN（两端必须一致）
#   2. docker compose up -d
#   3. 访问 http://localhost:5679 ，设置页「关于更新」可检查/一键更新
#
# 数据持久化在命名卷 naka-data（SQLite + 生成的图片/视频 + 可在线编辑的 workspace/skills）。
#
# Project name stays "naka-drama-studio" (this file used to live in that repo): the volume is still
# naka-drama-studio_naka-data and `docker compose up -d` here replaces the old containers instead of
# starting a second stack on an empty volume. Change it only for a fresh install.
name: naka-drama-studio

services:
  app:
    image: kimyohant/naka-ai:latest
    build:
      context: .
      # 前端在 kimyohant/naka-drama-studio — 需 checkout 在本 repo 旁边（../naka-drama-studio）
      additional_contexts:
        frontend: ../naka-drama-studio/frontend
      args:
        # 构建时注入版本号（发布镜像时务必指定，如 NAKA_VERSION=1.2.0）
        NAKA_VERSION: ${NAKA_VERSION:-dev}
    ports:
      - "127.0.0.1:5679:5679"
    environment:
      NAKA_HOST: 0.0.0.0
      NAKA_AUTH_USER: ${NAKA_AUTH_USER:-admin}
      NAKA_AUTH_PASSWORD: ${NAKA_AUTH_PASSWORD:?Set NAKA_AUTH_PASSWORD in .env}
      # 后台管理 /admin（系统设置）登录密码，≥ 16 字符
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      # 配置后设置页「关于更新」出现「立即更新」按钮；删除这两行则退化为手动更新提示
      NAKA_WATCHTOWER_URL: http://watchtower:8080
      NAKA_WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN:-please-change-me}
      # 发布清单（默认 GitHub Releases latest.json，与桌面版同一份）
      # NAKA_UPDATE_FEED: https://github.com/kimyohant/naka-ai/releases/latest/download/latest.json
    volumes:
      - naka-data:/app/data
    labels:
      # Watchtower --label-enable：只更新显式标记的容器
      com.centurylinklabs.watchtower.enable: "true"
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    command: >
      --http-api-update
      --http-api-token ${WATCHTOWER_TOKEN:-please-change-me}
      --label-enable
      --cleanup
      --rolling-restart
      --interval 86400
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  naka-data:
